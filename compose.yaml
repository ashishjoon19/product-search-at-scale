services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: product_search
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=16MB", "-c", "maintenance_work_mem=512MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_search"]
      interval: 5s
      timeout: 3s
      retries: 20
  meilisearch:
    image: getmeili/meilisearch:v1.56.0
    environment:
      MEILI_MASTER_KEY: local-development-key
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data

volumes:
  postgres_data:
  meili_data:
